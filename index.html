<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardware Flashcards & Matching Game</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f0fcff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        nav {
            margin-bottom: 30px;
        }
        button {
            padding: 10px 20px;
            font-size: 1.1rem;
            margin: 0 10px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: #1b365d;
            color: white;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #2a528a;
        }
        .page {
            display: none;
            width: 100%;
            max-width: 1200px;
        }
        .page.active {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        /* Flashcards Styles */
        .flashcard {
            width: 320px;
            height: 250px;
            perspective: 1000px;
            margin: 15px;
            cursor: pointer;
        }
        .card-inner {
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            position: relative;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
        .flashcard.flipped .card-inner {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .card-front {
            background-color: white;
            color: #222;
        }
        .card-front img {
            max-width: 120px;
            max-height: 90px;
            object-fit: contain;
            margin-bottom: 15px;
        }
        .card-back {
            background-color: #1b365d;
            color: white;
            transform: rotateY(180deg);
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .analogy {
            margin-top: 10px;
            font-style: italic;
            color: #add8e6;
        }

        /* Matching Game Styles */
        .matching-container {
            display: flex;
            width: 100%;
            gap: 20px;
            justify-content: space-between;
        }
        .col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .match-item {
            background: white;
            border: 3px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 100px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .match-img {
            max-width: 100px;
            max-height: 80px;
            object-fit: contain;
        }
        .match-item.selected {
            border-color: #3498db;
            background-color: #ebf5fb;
            transform: scale(1.02);
        }
        .match-item.matched {
            border-color: #2ecc71;
            background-color: #eafaf1;
            cursor: default;
            opacity: 0.7;
        }
        .match-item.wrong {
            border-color: #e74c3c;
            background-color: #fadbd8;
        }
        .def-text {
            font-size: 0.9rem;
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <nav>
        <button onclick="showPage('flashcards')">Page 1: Flashcards</button>
        <button onclick="showPage('matching')">Page 2: Matching Game</button>
    </nav>

    <!-- PAGE 1: FLASHCARDS -->
    <div id="flashcards" class="page active">
        <!-- Generated via JS to keep code DRY -->
    </div>

    <!-- PAGE 2: MATCHING GAME -->
    <div id="matching" class="page">
        <h2 style="width: 100%; text-align: center;">Click a picture, then click its matching definition!</h2>
        <div class="matching-container">
            <div class="col" id="match-images"></div>
            <div class="col" id="match-defs"></div>
        </div>
    </div>

    <script>
        const hardwareData = [
            {
                id: 'cpu',
                name: 'CPU',
                img: 'https://upload.wikimedia.org/wikipedia/commons/d/d7/Cpu-processor.jpg',
                def: '<strong>Central Processing Unit:</strong> The primary component of a computer that acts as its "brain," executing instructions of a computer program by performing basic arithmetic, logical, control, and input/output operations.',
                analogy: 'Analogy: Like the head chef in a kitchen, reading the recipes and executing all the orders at lightning speed.'
            },
            {
                id: 'mobo',
                name: 'Motherboard',
                img: 'https://upload.wikimedia.org/wikipedia/commons/b/bd/Motherboard_picture_1.jpg',
                def: '<strong>Motherboard:</strong> A printed circuit board containing the principal components of a computer or other device, featuring connectors into which other internal circuit boards can be slotted.',
                analogy: 'Analogy: Like the city\'s highway system, providing the physical roads for data and power to travel between all the different buildings.'
            },
            {
                id: 'gpu',
                name: 'GPU',
                img: 'https://upload.wikimedia.org/wikipedia/commons/5/5f/Video-card.jpg',
                def: '<strong>Graphics Processing Unit:</strong> A specialized electronic circuit designed to rapidly manipulate and alter memory to accelerate the creation of images in a frame buffer intended for output to a display device.',
                analogy: 'Analogy: Like a dedicated artist painting a highly detailed canvas, taking the heavy visual lifting off the head chef.'
            },
            {
                id: 'psu',
                name: 'PSU',
                img: 'https://upload.wikimedia.org/wikipedia/commons/d/d1/ATX_power_supply.jpg',
                def: '<strong>Power Supply Unit:</strong> An internal hardware component that converts standard electrical AC power from a wall outlet into the low-voltage, regulated DC power required by the internal components.',
                analogy: 'Analogy: Like the electrical power plant of the city, safely distributing the exact amount of energy each building needs to function.'
            },
            {
                id: 'ram',
                name: 'RAM',
                img: 'https://upload.wikimedia.org/wikipedia/commons/7/7c/DDER_SDRAM_Memory_module_for_desktop_PC.jpg',
                def: '<strong>Random Access Memory:</strong> A form of volatile computer memory that can be read and changed in any order, typically used to store working data and machine code currently in use.',
                analogy: 'Analogy: Like the chef\'s countertop; it provides quick access to active ingredients, but gets wiped completely clean at the end of the day.'
            },
            {
                id: 'fan',
                name: 'Cooling Fan',
                img: 'https://upload.wikimedia.org/wikipedia/commons/5/5a/12cm_pc_fan.jpg',
                def: '<strong>Cooling Fan:</strong> An active hardware component used to draw cooler ambient air into the computer case, expel warm air from inside, or move air across a heat sink.',
                analogy: 'Analogy: Like the kitchen\'s exhaust hood, rapidly pulling dangerous hot air out so the chef doesn\'t overheat during the dinner rush.'
            },
            {
                id: 'ssd',
                name: 'SSD',
                img: 'https://upload.wikimedia.org/wikipedia/commons/6/66/Solid_state_drive.jpg',
                def: '<strong>Solid-State Drive:</strong> A solid-state storage device that uses integrated circuit assemblies (flash memory) to store data persistently, functioning without moving mechanical parts.',
                analogy: 'Analogy: Like a modern digital safe, booting up instantly and storing your recipes permanently without any moving parts.'
            },
            {
                id: 'hdd',
                name: 'Hard Drive',
                img: 'https://upload.wikimedia.org/wikipedia/commons/f/f8/Hard_drive_opened.jpg',
                def: '<strong>Hard Disk Drive:</strong> An electro-mechanical data storage device that stores and retrieves digital data using magnetic storage on one or more rigid, rapidly rotating platters.',
                analogy: 'Analogy: Like a massive mechanical filing cabinet; it isn\'t the fastest way to find a file, but it offers incredible long-term storage capacity.'
            },
            {
                id: 'wifi',
                name: 'Wireless Card',
                img: 'https://upload.wikimedia.org/wikipedia/commons/7/7c/Wifi_card.jpg',
                def: '<strong>Wireless Network Interface Controller:</strong> A network interface component that connects to a wireless radio-based computer network, allowing communication over Wi-Fi without cables.',
                analogy: 'Analogy: Like a radio antenna, catching invisible signals from the outside world and bringing them inside without needing a physical wire.'
            },
            {
                id: 'sound',
                name: 'Sound Card',
                img: 'https://upload.wikimedia.org/wikipedia/commons/b/bc/Creative_SoundBlaster_X-Fi_Fatal1ty_Pro_PCIe-Card.jpg',
                def: '<strong>Sound Card:</strong> An internal expansion card that facilitates the input and output of audio signals to and from a computer under the control of computer software.',
                analogy: 'Analogy: Like a specialized sound engineer, taking basic noises and upgrading them into a cinematic, high-fidelity listening experience.'
            }
        ];

        // 1. Build Flashcards
        const flashcardsContainer = document.getElementById('flashcards');
        hardwareData.forEach(item => {
            flashcardsContainer.innerHTML += `
                <div class="flashcard" onclick="this.classList.toggle('flipped')">
                    <div class="card-inner">
                        <div class="card-front">
                            <img src="${item.img}" alt="${item.name}">
                            <h2>${item.name}</h2>
                        </div>
                        <div class="card-back">
                            <div>${item.def}</div>
                            <div class="analogy">${item.analogy}</div>
                        </div>
                    </div>
                </div>
            `;
        });

        // 2. Build Matching Game
        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        const imagesCol = document.getElementById('match-images');
        const defsCol = document.getElementById('match-defs');

        let imageNodes = hardwareData.map(item => `<div class="match-item type-img" data-id="${item.id}"><img class="match-img" src="${item.img}" alt="${item.name}"></div>`);
        let defNodes = hardwareData.map(item => `<div class="match-item type-def" data-id="${item.id}"><div class="def-text">${item.def}<br><br><span class="analogy" style="color:#2980b9">${item.analogy}</span></div></div>`);

        imageNodes = shuffle(imageNodes);
        defNodes = shuffle(defNodes);

        imagesCol.innerHTML = imageNodes.join('');
        defsCol.innerHTML = defNodes.join('');

        // 3. Matching Game Logic
        let selectedImg = null;
        let selectedDef = null;

        document.querySelectorAll('.match-item').forEach(el => {
            el.addEventListener('click', function() {
                if (this.classList.contains('matched')) return; // ignore already matched

                // Select image
                if (this.classList.contains('type-img')) {
                    if (selectedImg) selectedImg.classList.remove('selected');
                    selectedImg = this;
                    selectedImg.classList.add('selected');
                } 
                // Select definition
                else if (this.classList.contains('type-def')) {
                    if (selectedDef) selectedDef.classList.remove('selected');
                    selectedDef = this;
                    selectedDef.classList.add('selected');
                }

                // Check match
                if (selectedImg && selectedDef) {
                    if (selectedImg.dataset.id === selectedDef.dataset.id) {
                        // Match success
                        selectedImg.classList.remove('selected');
                        selectedDef.classList.remove('selected');
                        selectedImg.classList.add('matched');
                        selectedDef.classList.add('matched');
                        selectedImg = null;
                        selectedDef = null;
                    } else {
                        // Match fail
                        selectedImg.classList.add('wrong');
                        selectedDef.classList.add('wrong');
                        setTimeout(() => {
                            selectedImg.classList.remove('wrong', 'selected');
                            selectedDef.classList.remove('wrong', 'selected');
                            selectedImg = null;
                            selectedDef = null;
                        }, 800);
                    }
                }
            });
        });

        // Navigation
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }
    </script>
</body>
</html>
